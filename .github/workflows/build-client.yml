name: Build TurovFy Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Подготовка структуры веб-директории для Capacitor
        run: |
          rm -rf www
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/; fi
          if [ -d assets ]; then cp -r assets www/; fi
          ls -la www/

      - name: Установка зависимостей и инициализация Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap update android

      - name: Настройка сетевых разрешений и Cleartext HTTP
        run: |
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>' > android/app/src/main/res/xml/network_security_config.xml

          sed -i '/<application/c\<application android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true" android:appComponentFactory="androidx.core.app.CoreComponentFactory" style="@style/AppTheme">' android/app/src/main/AndroidManifest.xml
          
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Сборка Debug APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Загрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Client-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
