name: Build TurovFy PWA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Подготовка манифеста и PWA структуры
        run: |
          # Создаем базовый манифест для установки на телефон, если его нет
          if [ ! -f manifest.json ]; then
            echo '{
              "name": "TurovFy",
              "short_name": "TurovFy",
              "start_url": "./index.html",
              "display": "standalone",
              "background_color": "#0d0d0d",
              "theme_color": "#0d0d0d",
              "icons": [
                {
                  "src": "assets/logo.png",
                  "sizes": "192x192",
                  "type": "image/png"
                }
              ]
            }' > manifest.json
          fi

          # Убеждаемся, что в index.html прописан манифест
          if ! grep -q "manifest.json" index.html; then
            sed -i '/<\/head>/i <link rel="manifest" href="manifest.json">' index.html
          fi

      - name: Загрузка файлов сайта в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-PWA-Web
          path: |
            index.html
            manifest.json
            assets/
